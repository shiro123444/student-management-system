<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Educational QA Bot - AI-powered learning assistant" />
    <meta name="keywords" content="education, AI, chatbot, learning, questions, answers" />
    
    <!-- Accessibility -->
    <meta name="color-scheme" content="light dark" />
    
    <!-- Security -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:8000;" />
    
    <title>Educational QA Bot</title>
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="http://localhost:8000" />
    
    <!-- Icons and manifest -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
      /* Critical CSS for initial render */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f8fafc;
        overflow-x: hidden;
      }
      
      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        body {
          color: #e2e8f0;
          background-color: #0f172a;
        }
      }
      
      /* High contrast mode */
      @media (prefers-contrast: high) {
        body {
          background-color: white;
          color: black;
        }
      }
      
      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      
      /* Loading state */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-size: 1.1rem;
        color: #64748b;
      }
      
      /* Focus outline for accessibility */
      :focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading" role="status" aria-live="polite">
        <span>Loading Educational QA Bot...</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
